site_name: Théorie de Maîtrise du Temps
site_description: Une théorie alternative à ΛCDM basée sur la superposition temporelle
site_author: Pierre-Olivier A. Després
copyright: © 2026 Pierre-Olivier A. Després - Théorie de Maîtrise du Temps

docs_dir: docs

nav:
  - Accueil: index.md
  - Version Complète: version-complete
  - Lexique: lexique.md
  - Ponts Conceptuels:
    - Vue d'ensemble: ponts_conceptuels/index.md
    - Physique connue: ponts_conceptuels/physique_connue.md
    - Mécanique quantique: ponts_conceptuels/mecanique_quantique.md
    - Relativité générale: ponts_conceptuels/relativite_generale.md
    - Thermodynamique: ponts_conceptuels/thermodynamique.md
    - Cosmologie: ponts_conceptuels/cosmologie.md
    - Particules: ponts_conceptuels/particules.md
    - Mesures: ponts_conceptuels/mesures.md
  - Validation Empirique:
    - Vue d'ensemble: validation/index.md
    - Courbes de rotation: validation/courbes_rotation/index.md
    - Échelle cosmologique: validation/echelle_cosmo/index.md
    - Autres tests: validation/autres_tests/index.md
    - Scripts de reproduction: validation/scripts_reproduction.md
  - Publications:
    - Vue d'ensemble: publications/index.md
    - Package Zenodo: publications/package_zenodo.md
    - Article scientifique: publications/article_scientifique.md

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search

extra:
  generator: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
