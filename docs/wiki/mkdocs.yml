site_name: TMT — Temporon-Mediated Theory
site_description: A scalar-tensor extension of general relativity with double-well potential. Research notes and reproducibility materials by Pierre-Olivier Després Asselin (Independent Researcher, Montréal).
site_author: Pierre-Olivier Després Asselin
copyright: © 2026 Pierre-Olivier Després Asselin

docs_dir: docs

nav:
  - Accueil: index.md
  - Théorie: theorie.md
  - Résultats galactiques: resultats-galactiques.md
  - Publications: publications.md
  - Limites et questions ouvertes: limitations.md
  - FAQ: faq.md
  - À propos: a-propos.md

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      fallback_to_default: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          theme:
            language: en
          nav_translations:
            Accueil: Home
            Théorie: Theory
            Résultats galactiques: Galactic results
            Publications: Publications
            Limites et questions ouvertes: Limitations and open questions
            FAQ: FAQ
            À propos: About
        - locale: es
          name: Español
          build: false

extra:
  generator: false
  alternate:
    - name: Français
      link: /fr/
      lang: fr
    - name: English
      link: /en/
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
