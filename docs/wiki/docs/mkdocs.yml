site_name: Théorie de Maîtrise du Temps v2.4
site_description: Une théorie alternative à ΛCDM basée sur la superposition temporelle
site_author: Pierre-Olivier A. Després
copyright: © 2026 Pierre-Olivier A. Després - Théorie de Maîtrise du Temps
docs_dir: .

nav:
  - Accueil: index.md
  - Lexique: lexique.md
  - Ponts Conceptuels: ponts_conceptuels/
  - Validation Empirique: validation/
  - Publications: publications/

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      fallback_to_default: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          theme:
            language: en
          nav_translations:
            Accueil: Home
            Lexique: Lexicon
            Ponts Conceptuels: Conceptual Bridges
            Validation Empirique: Empirical Validation
            Publications: Publications
        - locale: es
          name: Español
          build: true
          theme:
            language: es
          nav_translations:
            Accueil: Inicio
            Lexique: Léxico
            Ponts Conceptuels: Puentes Conceptuales
            Validation Empirique: Validación Empírica
            Publications: Publicaciones

extra:
  version:
    provider: mike
  alternate:
    - name: Français
      link: /fr/
      lang: fr
    - name: English
      link: /en/
      lang: en
    - name: Español
      link: /es/
      lang: es

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
